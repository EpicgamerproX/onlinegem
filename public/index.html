<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Lost: Office</title>
  <link rel="icon" href="favicon.ico">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
    }
    #instructions {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="instructions">
    <strong>Signal Lost: Office</strong><br>
    Click to enable mouse look.<br>
    Use WASD to move.<br>
    Stay silent to survive longer.<br>
    Noise attracts the entity.
  </div>
  <script type="module" src="../src/main.js"></script>
</body>
</html>
